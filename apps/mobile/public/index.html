<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Bug UX-1429: the browser-tab icon (the house logo, favicon cut). The web
         server keeps .ico files for a year without checking again, so the link
         carries a version: a returning visitor's browser sees a new address
         and fetches the new icon instead of reusing the old "oS" one. The
         version is the first 8 hex digits of the SHA-256 of public/favicon.ico.
         Change it whenever that file changes;
         __tests__/bug-ux-1429-web-favicon-versioned-link.test.ts fails until
         it matches. Because public/favicon.ico exists, Expo copies it as is and
         adds no second, unversioned icon link of its own. -->
    <link rel="icon" href="/favicon.ico?v=841447da" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
