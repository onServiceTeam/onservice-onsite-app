appId: ph.onservice.app
---
# F#3 visual baseline — provider-onboarding-review-pending
# Screen: apps/mobile/app/provider-onboarding/review-pending.tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://provider-onboarding/review-pending
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/provider-onboarding-review-pending/default
