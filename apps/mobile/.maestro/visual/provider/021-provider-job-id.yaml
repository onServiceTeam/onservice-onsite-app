appId: ph.onservice.app
---
# F#3 visual baseline — provider-job-id
# Screen: apps/mobile/app/provider/job/[id].tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://provider/job/${MAESTRO_JOB_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/provider-job-id/default
