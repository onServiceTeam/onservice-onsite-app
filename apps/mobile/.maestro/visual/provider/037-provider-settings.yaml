appId: ph.onservice.app
---
# F#3 visual baseline — provider-settings
# Screen: apps/mobile/app/provider/settings.tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://provider/settings
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/provider-settings/default
