appId: ph.onservice.app
---
# F#3 visual baseline — customer-provider-id
# Screen: apps/mobile/app/customer/provider/[id].tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://customer/provider/${MAESTRO_PROVIDER_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/customer-provider-id/default
