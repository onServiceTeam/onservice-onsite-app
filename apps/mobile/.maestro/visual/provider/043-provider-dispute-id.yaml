appId: ph.onservice.app
---
# F#3 visual baseline — provider-dispute-id
# Screen: apps/mobile/app/provider/dispute/[id].tsx

- launchApp:
    stopApp: false
- openLink: onservice://provider/dispute/${MAESTRO_DISPUTE_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/provider-dispute-id/default
