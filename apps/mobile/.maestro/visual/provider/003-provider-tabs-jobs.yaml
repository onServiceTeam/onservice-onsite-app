appId: ph.onservice.app
---
# F#3 visual baseline — provider-tabs-jobs
# Screen: apps/mobile/app/(provider-tabs)/jobs.tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://jobs
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/provider-tabs-jobs/default
