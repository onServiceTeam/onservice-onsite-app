appId: ph.onservice.app
---
# F#3 visual baseline — provider-chat-id
# Screen: apps/mobile/app/provider/chat/[id].tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.
# D38 Milestone 2: [id] is the BOOKING id (not a conversation id); each pro
# has one thread per booking.

- launchApp:
    stopApp: false
- openLink: onservice://provider/chat/${MAESTRO_BOOKING_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/provider/provider-chat-id/default
