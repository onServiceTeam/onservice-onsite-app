appId: ph.onservice.app
---
# F#3 visual baseline — auth-login
# Screen: apps/mobile/app/auth/login.tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://auth/login
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/customer/auth-login/default
