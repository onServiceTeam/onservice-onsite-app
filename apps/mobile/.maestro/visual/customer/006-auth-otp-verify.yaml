appId: ph.onservice.app
---
# F#3 visual baseline — auth-otp-verify
# Screen: apps/mobile/app/auth/otp-verify.tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://auth/otp-verify
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/customer/auth-otp-verify/default
