appId: com.onservice.app
---
# Phase 14 Remediation #3 - visual baseline flow for customer-booking-review
# Screen: apps/mobile/app/customer/booking/review.tsx
#
# Captures 4 states (loading, empty, error, success) at the device's
# native viewport. Operator runs `maestro test --update-snapshots` to
# capture baselines into apps/mobile/.maestro/visual/baselines/customer/.

- launchApp:
    clearState: true
    stopApp: true

# Default render
- takeScreenshot: customer/customer-booking-review/default

# Loading state - API stalls so skeleton renders.
# Uncomment when the operator wires a delay-fixture in scripts/maestro/.
# - runScript: scripts/maestro/force-loading.sh
# - takeScreenshot: customer/customer-booking-review/loading

# Empty state - navigate with empty fixture (route-specific).
# Uncomment when the operator wires an empty-fixture seeder.
# - runScript: scripts/maestro/seed-empty.sh
# - takeScreenshot: customer/customer-booking-review/empty

# Error state - force network error.
# - runScript: scripts/maestro/force-error.sh
# - takeScreenshot: customer/customer-booking-review/error

# Success state
# - runScript: scripts/maestro/seed-success.sh
# - takeScreenshot: customer/customer-booking-review/success
