appId: ph.onservice.app
---
# F#3 visual baseline — customer-dispute-id
# Screen: apps/mobile/app/customer/dispute/[id].tsx

- launchApp:
    stopApp: false
- openLink: onservice://customer/dispute/${MAESTRO_DISPUTE_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/customer/customer-dispute-id/default
