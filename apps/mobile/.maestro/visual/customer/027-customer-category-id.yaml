appId: ph.onservice.app
---
# F#3 visual baseline — customer-category-id
# Screen: apps/mobile/app/customer/category/[id].tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://customer/category/${MAESTRO_CATEGORY_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/customer/customer-category-id/default
