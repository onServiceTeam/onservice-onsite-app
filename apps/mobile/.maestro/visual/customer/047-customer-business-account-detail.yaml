appId: ph.onservice.app
---
# F#3 visual baseline — customer-business-account-detail
# Screen: apps/mobile/app/customer/business/[id]/index.tsx

- launchApp:
    stopApp: false
- openLink: onservice://customer/business/${MAESTRO_BUSINESS_ACCOUNT_ID}
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/customer/customer-business-account-detail/default
