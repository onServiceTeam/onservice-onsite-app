appId: ph.onservice.app
---
# F#3 visual baseline — customer-booking-change-order
# Screen: apps/mobile/app/customer/booking/change-order.tsx
# Session comes from 000-setup-login.yaml (runs first in this directory);
# deep link jumps straight to the target route via expo-router.

- launchApp:
    stopApp: false
- openLink: onservice://customer/booking/change-order
- extendedWaitUntil:
    notVisible:
      id: "loading"
    timeout: 2000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: .maestro/visual/baselines/customer/customer-booking-change-order/default
