services:
  postgres:
    # Matches the dev image (proven with the migrations). PG18 PostGIS images
    # are not published under an 18-3.5 tag; 17-3.5 is the supported pair.
    image: postgis/postgis:17-3.5
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      # Run on first DB init: creates pgcrypto + postgis extensions and the
      # uuidv7() shim the migrations require (PG17 has no native uuidv7()).
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 10s
      retries: 3

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # The API connects to pgbouncer:6432 (DATABASE_URL above), but the
      # edoburu image listens on 5432 by default. Make it listen on 6432.
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 100
      RESERVE_POOL_SIZE: 20
      SERVER_IDLE_TIMEOUT: 300
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata_prod:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      # Defaults to production. Set NODE_ENV=staging in .env to run a staging
      # deployment that boots without live payment/SMS/captcha keys (and, with
      # ALLOW_DEV_OTP=1, accepts the demo login code for testing). Flip back to
      # production once the real secrets are in place.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 7381
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}
      DATABASE_DIRECT_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # §35a/§36 — file storage lives on THIS Hetzner box (local disk), not an
      # external object store. Empty S3_BUCKET forces the local-FS backend;
      # uploads persist in the uploads_data volume. Overrides any stale S3_*
      # values still present in .env.
      S3_BUCKET: ""
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: https://api.onservice.ph/uploads
    volumes:
      # Persistent upload storage (booking photos = public via nginx; KYC docs
      # under onboarding/ = private, reachable only through the API proxy).
      - uploads_data:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7381/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # E07 — HTTP Basic Auth gate for the admin back office (admin.onservice.ph).
      # The hash file is generated on the server and is gitignored (never committed);
      # only the auth_basic directive lives in nginx.conf. See escalation E07.
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./apps/admin/dist:/usr/share/nginx/admin:ro
      - ./apps/mobile/dist-web:/usr/share/nginx/app:ro
      # §35a — serve public uploads (booking photos) straight off disk. The KYC
      # subtree (onboarding/) is blocked in nginx.conf and served only via the
      # authenticated API proxy.
      - uploads_data:/usr/share/nginx/uploads:ro
      # Public legal pages (privacy/terms) — required by NPC registration +
      # app-store submission. Static HTML, served at /privacy and /terms.
      - ./legal:/usr/share/nginx/legal:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v3.3.0
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:11.5.2
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.onservice.ph
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  pgdata_prod:
  redisdata_prod:
  nginx_logs:
  prometheus_data:
  grafana_data:
  uploads_data:
