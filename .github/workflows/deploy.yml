name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations'
        required: false
        default: 'false'
        type: boolean
      migration_target:
        description: 'Exact reviewed migration basename, required when migrations run (for example 148_provider_portfolio_consent)'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Build API Docker image
        run: |
          docker build \
            -f packages/api/Dockerfile \
            -t onservice-api:${{ github.sha }} \
            -t onservice-api:latest \
            .

      - name: Save Docker image
        run: docker save onservice-api:${{ github.sha }} | gzip > api-image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: api-image.tar.gz
          target: /tmp/

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.1
        env:
          RELEASE_SHA: ${{ github.sha }}
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations }}
          MIGRATION_TARGET: ${{ github.event.inputs.migration_target }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_SHA,RUN_MIGRATIONS,MIGRATION_TARGET
          script: |
            set -euo pipefail

            cd /opt/onservice

            # Load the new image
            sudo -n docker load < /tmp/api-image.tar.gz
            rm -f /tmp/api-image.tar.gz

            # The repository is public. Fetch without relying on a server-side
            # GitHub deploy key, then fast-forward the root-owned checkout only.
            sudo -n git -c safe.directory=/opt/onservice \
              fetch https://github.com/onServiceTeam/onservice-onsite-app.git master
            sudo -n git -c safe.directory=/opt/onservice merge --ff-only FETCH_HEAD
            test "$(sudo -n git -c safe.directory=/opt/onservice rev-parse HEAD)" = "$RELEASE_SHA"

            # Run only the explicitly named, reviewed migration. The helper
            # backs this with a dry run and uses the direct Postgres connection.
            if [ "$RUN_MIGRATIONS" = "true" ]; then
              migration_target="$MIGRATION_TARGET"
              if ! [[ "$migration_target" =~ ^[0-9]{3}_[a-z0-9_]+$ ]]; then
                echo "ERROR: migration_target is required and must be an exact migration basename."
                exit 1
              fi
              echo "Backing up production before migration $migration_target..."
              sudo -n bash scripts/server/backup-db.sh
              sudo -n env MIGRATION_TARGET="$migration_target" \
                bash scripts/server/run-production-migrations.sh
            fi

            # Rolling restart: build and recreate only the API service
            sudo -n docker compose -f docker-compose.prod.yml up -d --no-deps api

            # Wait for health check
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if sudo -n docker compose -f docker-compose.prod.yml exec -T api \
                curl -sf http://localhost:7381/health/ready > /dev/null 2>&1; then
                echo "API is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: Health check failed after 30 attempts."
                echo "Manual intervention required. Inspect logs below:"
                sudo -n docker compose -f docker-compose.prod.yml logs --tail=50 api
                exit 1
              fi
              sleep 2
            done

            echo "Deployment complete: $RELEASE_SHA"
