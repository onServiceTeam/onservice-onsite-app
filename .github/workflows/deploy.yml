# NOT USED. Releases do not go through this workflow. (Header added
# 2026-10-14 under D40; the workflow below is unchanged.)
#
# Checked read-only on 2026-10-14:
# - It has never run on GitHub (0 runs).
# - The repository has no Actions secrets, so DEPLOY_HOST, DEPLOY_USER and
#   DEPLOY_SSH_KEY below are not set.
# - The "production" environment it names does not exist on GitHub (the only
#   environment is "copilot").
# - It is still enabled and can be started by hand. Disabling or removing it
#   is Ken's decision.
# Re-checked read-only on 2026-10-17: still 0 runs, still no Actions secrets,
# still only the "copilot" environment, still enabled.
#
# The live server is the tester server, not a real-customer production.
# Tester-server releases follow docs/runbooks/tester-server-release.md, using
# scripts/release/deploy-tester-release.sh and
# scripts/release/publish-web-builds.sh.
#
# Nothing is enforced by GitHub: branch protection and rulesets are off by
# Ken's choice (D40).
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations'
        required: false
        default: 'false'
        type: boolean
      migration_target:
        description: 'Reviewed upper-bound migration basename; every pending prerequisite through it runs (required when migrations run)'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          # A moving master checkout can differ from the dispatch's SHA.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build API Docker image
        run: |
          docker build \
            -f packages/api/Dockerfile \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t onservice-api:${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save onservice-api:${{ github.sha }} | gzip > api-image.tar.gz
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git bundle create onservice-release.bundle HEAD
          git bundle verify onservice-release.bundle

      - name: Copy image and verified source bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: api-image.tar.gz,onservice-release.bundle
          target: /tmp/

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.1
        env:
          RELEASE_SHA: ${{ github.sha }}
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations }}
          MIGRATION_TARGET: ${{ github.event.inputs.migration_target }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_SHA,RUN_MIGRATIONS,MIGRATION_TARGET
          script: |
            set -euo pipefail

            cd /opt/onservice

            # Load the new image
            sudo -n docker load < /tmp/api-image.tar.gz
            rm -f /tmp/api-image.tar.gz

            # Verify and fetch the exact source bundle produced from this
            # workflow's authenticated checkout. The server needs no GitHub
            # token or repository deploy key.
            sudo -n git -c safe.directory=/opt/onservice \
              bundle verify /tmp/onservice-release.bundle
            sudo -n git -c safe.directory=/opt/onservice \
              fetch /tmp/onservice-release.bundle \
              HEAD:refs/remotes/deploy/$RELEASE_SHA
            test "$(sudo -n git -c safe.directory=/opt/onservice rev-parse refs/remotes/deploy/$RELEASE_SHA)" = "$RELEASE_SHA"
            sudo -n git -c safe.directory=/opt/onservice \
              merge --ff-only refs/remotes/deploy/$RELEASE_SHA
            test "$(sudo -n git -c safe.directory=/opt/onservice rev-parse HEAD)" = "$RELEASE_SHA"
            rm -f /tmp/onservice-release.bundle

            # Verify that the loaded image and checkout have the same revision
            # before the backup/migration stage. This performs no activation.
            sudo -n env ONSERVICE_RELEASE_SHA="$RELEASE_SHA" \
              bash -c 'source scripts/server/release-api-common.sh'

            # Run every pending prerequisite through the reviewed boundary.
            # The helper dry-runs and verifies history on the direct connection.
            if [ "$RUN_MIGRATIONS" = "true" ]; then
              migration_target="$MIGRATION_TARGET"
              if ! [[ "$migration_target" =~ ^[0-9]{3}_[a-z0-9_]+$ ]]; then
                echo "ERROR: migration_target is required and must be an exact migration basename."
                exit 1
              fi
              echo "Backing up production before migration $migration_target..."
              sudo -n bash scripts/server/backup-db.sh
              sudo -n env MIGRATION_TARGET="$migration_target" ONSERVICE_RELEASE_SHA="$RELEASE_SHA" \
                bash scripts/server/run-production-migrations.sh
            fi

            sudo -n env ONSERVICE_RELEASE_SHA="$RELEASE_SHA" \
              bash scripts/server/activate-api-release.sh

            echo "API-only deployment complete: $RELEASE_SHA; web bundles are not deployed by this workflow."
