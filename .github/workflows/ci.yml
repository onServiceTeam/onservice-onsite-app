name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    name: API — TypeScript & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: onservice_test
          POSTGRES_PASSWORD: onservice_test
          POSTGRES_DB: onservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check — API
        run: npx tsc --noEmit --project packages/api/tsconfig.json

      - name: Run API tests
        run: npm test --workspace=packages/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://onservice_test:onservice_test@localhost:5432/onservice_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  admin-check:
    name: Admin — TypeScript
    runs-on: ubuntu-latest
    # The complete Admin suite now needs about 10 minutes including install
    # and build. A 10-minute cap cancelled a run after every test had passed.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check — Admin
        run: npx tsc --noEmit --project apps/admin/tsconfig.json

      - name: Build Admin
        run: npm run build --workspace=apps/admin

      - name: Admin vitest — per-page tests
        # Phase 14 R7-real: real DOM-render tests for 29 admin pages.
        run: npm run test --workspace=apps/admin

  mobile-check:
    name: Mobile — TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check — Mobile
        run: npx tsc --noEmit --project apps/mobile/tsconfig.json

      - name: Mobile jest — full suite
        # Phase 200 — run the ENTIRE mobile test suite, not just
        # __tests__/proof/ + __tests__/screens/. The narrow scope previously
        # let bug-phase* unit tests in __tests__/ root break without failing
        # CI (caught during the Cebu switch). Full suite is the real gate now.
        working-directory: apps/mobile
        run: npx jest --config jest.config.js

  docker-build:
    name: Docker — API Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-check]

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: onservice_test
          POSTGRES_PASSWORD: onservice_test
          POSTGRES_DB: onservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Build API Docker image
        run: docker build -f packages/api/Dockerfile -t onservice-api:ci-${{ github.sha }} .

      - name: Verify the API image boots and serves liveness
        run: |
          set -euo pipefail
          container="onservice-api-ci-${{ github.run_id }}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container" --network host \
            -e NODE_ENV=test \
            -e PORT=7381 \
            -e DATABASE_URL=postgresql://onservice_test:onservice_test@127.0.0.1:5432/onservice_test \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET=ci-test-secret-do-not-use-in-production \
            onservice-api:ci-${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7381/health >/dev/null; then
              echo "API image booted and served /health"
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              echo "API image failed its runtime boot check" >&2
              exit 1
            fi
            sleep 2
          done
