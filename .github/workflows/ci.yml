name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      retain_release_candidate:
        description: 'Retain the tested API image/source and admin web build for an isolated release rehearsal (no deployment)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    name: API — TypeScript & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: onservice_test
          POSTGRES_PASSWORD: onservice_test
          POSTGRES_DB: onservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check — API
        run: npx tsc --noEmit --project packages/api/tsconfig.json

      - name: Run API tests
        run: npm test --workspace=packages/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://onservice_test:onservice_test@localhost:5432/onservice_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  admin-check:
    name: Admin — TypeScript
    runs-on: ubuntu-latest
    # The complete Admin suite now needs about 10 minutes including install
    # and build. A 10-minute cap cancelled a run after every test had passed.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check — Admin
        run: npx tsc --noEmit --project apps/admin/tsconfig.json

      - name: Build Admin
        run: npm run build --workspace=apps/admin
        env:
          VITE_API_URL: https://admin.onservice.ph
          VITE_DEMO_MODE: '0'
          VITE_DEMO_ADMIN_EMAIL: ''
          VITE_DEMO_ADMIN_PASSWORD: ''

      - name: Admin vitest — per-page tests
        # Phase 14 R7-real: real DOM-render tests for 29 admin pages.
        run: npm run test --workspace=apps/admin

      - name: Identify admin candidate build
        if: (github.event_name == 'workflow_dispatch' && inputs.retain_release_candidate) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release-candidate'))
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test -s apps/admin/dist/index.html
          node -e 'require("node:fs").writeFileSync("apps/admin/dist/build-audit.json", JSON.stringify({sourceRevision: process.env.SOURCE_REVISION, apiOrigin: "https://admin.onservice.ph", demoMode: false, deploymentEligible: false, limitation: "Release rehearsal input; authenticated acceptance is not included."}, null, 2) + "\n")'

      - name: Retain requested admin candidate build
        if: (github.event_name == 'workflow_dispatch' && inputs.retain_release_candidate) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release-candidate'))
        uses: actions/upload-artifact@v7
        with:
          name: onservice-admin-candidate-${{ github.sha }}
          path: apps/admin/dist/
          if-no-files-found: error
          retention-days: 3

  mobile-check:
    name: Mobile — TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check — Mobile
        run: npx tsc --noEmit --project apps/mobile/tsconfig.json

      - name: Mobile jest — full suite
        # Phase 200 — run the ENTIRE mobile test suite, not just
        # __tests__/proof/ + __tests__/screens/. The narrow scope previously
        # let bug-phase* unit tests in __tests__/ root break without failing
        # CI (caught during the Cebu switch). Full suite is the real gate now.
        working-directory: apps/mobile
        run: npx jest --config jest.config.js

      - name: Build customer and provider web audit bundle
        # Type checks/native renders cannot prove that Metro exports for web.
        # This is a no-demo audit artifact, not a deployable client-pilot build:
        # public CAPTCHA configuration and authenticated acceptance are absent.
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist-web-ci --clear
        env:
          NODE_ENV: production
          EXPO_OS: web
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_URL: https://app.onservice.ph
          EXPO_PUBLIC_DEMO_MODE: '0'
          EXPO_PUBLIC_DEMO_CUSTOMER_PHONE: ''
          EXPO_PUBLIC_DEMO_PROVIDER_PHONE: ''
          EXPO_PUBLIC_DEMO_OTP: ''
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ''
          EAS_PROJECT_ID: ''
          SENTRY_DSN_MOBILE: ''

      - name: Identify browser audit artifact
        working-directory: apps/mobile
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test -s dist-web-ci/index.html
          node -e 'require("node:fs").writeFileSync("dist-web-ci/build-audit.json", JSON.stringify({sourceRevision: process.env.SOURCE_REVISION, apiOrigin: "https://app.onservice.ph", demoMode: false, deploymentEligible: false, limitation: "Browser build evidence only; public CAPTCHA configuration and authenticated acceptance are not included."}, null, 2) + "\n")'

      - name: Retain customer and provider browser audit bundle
        uses: actions/upload-artifact@v7
        with:
          name: onservice-web-audit-${{ github.sha }}
          path: apps/mobile/dist-web-ci/
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker — API Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-check]

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: onservice_test
          POSTGRES_PASSWORD: onservice_test
          POSTGRES_DB: onservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          # A requested source bundle must be usable on the older live checkout,
          # not a shallow object set that omits its required ancestry.
          fetch-depth: 0

      - name: Build API Docker image
        run: docker build -f packages/api/Dockerfile --label org.opencontainers.image.revision=${{ github.sha }} -t onservice-api:ci-${{ github.sha }} -t onservice-api:${{ github.sha }} .

      - name: Verify the API image boots and serves liveness
        run: |
          set -euo pipefail
          container="onservice-api-ci-${{ github.run_id }}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container" --network host \
            -e NODE_ENV=test \
            -e PORT=7381 \
            -e DATABASE_URL=postgresql://onservice_test:onservice_test@127.0.0.1:5432/onservice_test \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET=ci-test-secret-do-not-use-in-production \
            onservice-api:ci-${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7381/health >/dev/null; then
              echo "API image booted and served /health"
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              echo "API image failed its runtime boot check" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Package requested exact API candidate
        if: (github.event_name == 'workflow_dispatch' && inputs.retain_release_candidate) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release-candidate'))
        env:
          ONSERVICE_RELEASE_SHA: ${{ github.sha }}
          ONSERVICE_ARTIFACT_DIR: ${{ runner.temp }}/onservice-api-candidate
        run: bash scripts/server/package-api-candidate.sh

      - name: Retain requested exact API candidate
        if: (github.event_name == 'workflow_dispatch' && inputs.retain_release_candidate) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release-candidate'))
        uses: actions/upload-artifact@v7
        with:
          name: onservice-api-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/onservice-api-candidate/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
