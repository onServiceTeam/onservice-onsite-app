name: Gates

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [phase/**]

env:
  BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}

jobs:
  gate-a:
    name: Gate A — cross-source-of-truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash scripts/gates/run-gate-a.sh

  gate-b:
    name: Gate B — bug deferral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Determine dispatch number
        id: dispatch
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          DISPATCH=$(echo "$BRANCH" | grep -oE "d[0-9]+" | grep -oE "[0-9]+" | head -1 || echo "")
          echo "number=$DISPATCH" >> "$GITHUB_OUTPUT"
      - name: Run Gate B
        if: steps.dispatch.outputs.number != ''
        run: bash scripts/gates/b-bug-deferral.sh "${{ steps.dispatch.outputs.number }}"

  gate-c:
    name: Gate C — constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # mode-lookup.sh wraps a tiny python3 helper to read MODES.json.
        # Ubuntu runners have python3 by default but pinning the version
        # makes the tier-lookup deterministic across runners.
        with:
          python-version: "3.11"
      - name: Gate smoke tests (verify gates themselves still reject violations)
        # Per Dispatch 03: each gate has a corresponding smoke test that
        # synthesizes a known-bad pattern and asserts the gate rejects it.
        # If a regex regression weakens a gate, the smoke test catches it
        # before the gate runs over the real tree.
        run: bash scripts/gates/__tests__/run-all.sh
      - name: Gate C — constitution
        run: bash scripts/gates/c-constitution.sh

  gate-d:
    name: Gate D — visual screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # E07 — .env.docker is now gitignored (so a real secret can't be committed).
      # Provision the local-dev defaults from the tracked template before the stack starts.
      - name: Provision local dev env file
        run: cp infra/docker/.env.docker.example infra/docker/.env.docker
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
        # cache: "pnpm" removed in D03 — this repo uses npm workspaces with
        # package-lock.json, not pnpm-lock.yaml. setup-node was failing the
        # job when it couldn't find a pnpm-lock.yaml to cache against.
        # Gate D and Gate E are REPORT-mode (per MODES.json gate_d_state /
        # gate_e_state) until D07/D11/D12 populate baselines anyway, so a
        # cold install is acceptable here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Install Playwright browsers
        run: cd apps/admin && pnpm exec playwright install chromium
        continue-on-error: true
      - name: Bring up local Docker stack (D0.5)
        # Gate D needs a real backend for end-to-end visual tests of the
        # admin pages. The local stack matches production behavior for
        # everything except DNS/TLS (D14 production-parity work).
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml \
            --env-file infra/docker/.env.docker up -d \
            postgres redis minio minio-init mailhog
          # Wait briefly for healthchecks to pass before tests run.
          for i in $(seq 1 30); do
            healthy=0
            for svc in onservice-postgres onservice-redis onservice-minio; do
              s=$(docker inspect --format '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo missing)
              [ "$s" = "healthy" ] && healthy=$((healthy + 1))
            done
            [ "$healthy" -eq 3 ] && break
            sleep 2
          done
        continue-on-error: true
      - run: bash scripts/gates/d-visual-screenshots.sh
      - name: Tear down Docker stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.dev.yml --env-file infra/docker/.env.docker down -v --remove-orphans
        continue-on-error: true
      - name: Upload visual diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/admin/test-results/

  gate-e:
    name: Gate E — mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # E07 — provision the gitignored local-dev env file from the tracked template.
      - name: Provision local dev env file
        run: cp infra/docker/.env.docker.example infra/docker/.env.docker
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
        # cache: "pnpm" removed in D03 — this repo uses npm workspaces with
        # package-lock.json, not pnpm-lock.yaml. setup-node was failing the
        # job when it couldn't find a pnpm-lock.yaml to cache against.
        # Gate D and Gate E are REPORT-mode (per MODES.json gate_d_state /
        # gate_e_state) until D07/D11/D12 populate baselines anyway, so a
        # cold install is acceptable here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Bring up local Docker stack (D0.5)
        # Gate E mutation testing on integration-tested code paths needs
        # a real DB. Stryker runs jest which connects to postgres for
        # integration tests of the money-conservation suite.
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml \
            --env-file infra/docker/.env.docker up -d \
            postgres redis
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' onservice-postgres 2>/dev/null || echo missing)
            [ "$s" = "healthy" ] && break
            sleep 2
          done
        continue-on-error: true
      - name: Run database migrations
        run: |
          DATABASE_URL="postgresql://onservice:onservice_dev@localhost:7383/onservice_dev" \
            bash scripts/run-migrations.sh
        continue-on-error: true
      - run: bash scripts/gates/e-mutation-testing.sh
        env:
          DATABASE_URL: postgresql://onservice:onservice_dev@localhost:7383/onservice_dev
          REDIS_URL: redis://localhost:7385
      - name: Tear down Docker stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.dev.yml --env-file infra/docker/.env.docker down -v --remove-orphans
        continue-on-error: true
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/api/reports/mutation/

  gates-summary:
    name: All gates passed
    runs-on: ubuntu-latest
    needs: [gate-a, gate-b, gate-c, gate-d, gate-e]
    steps:
      - run: echo "All gates green. Ready for human review."
