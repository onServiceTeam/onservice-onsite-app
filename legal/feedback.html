<style>
  :root {
    --teal: #0d9488;
    --teal-dark: #0f766e;
    --teal-tint: #f0fdfa;
    --ink: #1e293b;
    --navy: #0f172a;
    --muted: #526071;
    --line: #d5dde7;
    --bg: #f5f7fa;
    --card: #ffffff;
    --red: #b42318;
    --red-tint: #fef3f2;
    --amber-tint: #fffaeb;
    --amber-line: #f5c26b;
    --green: #067647;
    --green-tint: #ecfdf3;
    --focus: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  /* Brand bar: the house logo (Ken, 2026-10-14; docs/design-system/brand/README.md).
     On brand blue the tile is white with a blue house, and "onService PH" is one
     colour (white). The tile-to-word gap is 25% of the tile, as a margin because
     flex gap needs Chrome 84+. */
  .top { background: #003D9B; color: #fff; }
  .top-in { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; }
  .brand-tile { display: block; width: 32px; height: 32px; flex: 0 0 32px; margin-right: 8px; }
  .brand-word { font-weight: 800; font-size: 18px; line-height: 1.2; letter-spacing: -0.01em; color: #fff; white-space: nowrap; }
  .top-note { font-size: 14px; color: #cbd5e1; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; outline: none; }
  h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 12px; color: var(--navy); outline: none; }
  h2 { font-size: 19px; margin: 24px 0 8px; color: var(--navy); }
  p { margin: 0 0 12px; }
  ul.plain { margin: 0 0 12px; padding-left: 22px; }
  ul.plain li { margin-bottom: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 16px; }
  .callout { background: var(--teal-tint); border: 1px solid #99e2d8; border-radius: 14px; padding: 14px 16px; margin: 0 0 16px; }
  .note { background: var(--amber-tint); border: 1px solid var(--amber-line); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; font-size: 15px; }
  .muted { color: var(--muted); font-size: 15px; }
  .small { font-size: 14px; color: var(--muted); }
  .back { display: inline-block; padding: 10px 0; color: var(--teal-dark); font-weight: 600; text-decoration: none; min-height: 44px; }
  .back:hover { text-decoration: underline; }

  .field { margin: 0 0 18px; }
  .field > label, .lbl { display: block; font-weight: 600; margin-bottom: 6px; color: var(--navy); }
  .opt { font-weight: 400; color: var(--muted); }
  .hint { display: block; font-size: 14px; color: var(--muted); margin: -2px 0 6px; }
  textarea, input[type="text"], input[type="email"], select {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: #fff;
    border: 1.5px solid #b8c3d1; border-radius: 10px; padding: 10px 12px; min-height: 48px;
  }
  textarea { min-height: 96px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
  legend { font-weight: 600; color: var(--navy); padding: 0; margin-bottom: 8px; }
  /* Spacing uses margins, not flex gap: flex gap needs Chrome 84+, and testers may have older Android phones. */
  .choices { display: block; }
  .choice {
    display: flex; align-items: flex-start; background: #fff; border: 1.5px solid #b8c3d1;
    border-radius: 10px; padding: 12px; margin-bottom: 8px; min-height: 48px; cursor: pointer;
  }
  .choice.is-checked { border-color: var(--teal); background: var(--teal-tint); }
  .choice input { margin: 3px 10px 0 0; width: 20px; height: 20px; flex: 0 0 auto; }
  .choice .ct { display: block; }
  .choice .ch { display: block; font-size: 14px; color: var(--muted); }
  .scale { display: flex; }
  .scale .choice { flex: 1 1 0; flex-direction: column; align-items: center; padding: 8px 2px; margin: 0; min-width: 0; text-align: center; }
  .scale .choice + .choice { margin-left: 6px; }
  .scale .choice input { margin: 0 0 2px; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .scale-ends span:last-child { text-align: right; margin-left: 12px; }

  .btn {
    display: inline-block; font: inherit; font-weight: 700; font-size: 17px; border-radius: 12px; border: 2px solid var(--teal);
    background: var(--teal); color: #fff; padding: 12px 20px; min-height: 50px; cursor: pointer; text-decoration: none; text-align: center;
  }
  .btn:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
  .btn[disabled] { background: #9aa6b5; border-color: #9aa6b5; cursor: not-allowed; }
  .btn.secondary { background: #fff; color: var(--teal-dark); }
  .btn.secondary:hover { background: var(--teal-tint); }
  .btn.small-btn { font-size: 15px; padding: 6px 12px; min-height: 40px; }
  .btn.block { display: block; width: 100%; }
  .actions { display: flex; flex-wrap: wrap; margin: 3px -5px 0; }
  .actions .btn { flex: 1 1 160px; margin: 5px; }

  /* No h1 here: headings get focus from the script after each screen change, not from the tester. */
  a:focus, button:focus, input:focus, textarea:focus, select:focus, .choice:focus {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }

  .err { color: var(--red); background: var(--red-tint); border: 1px solid #fda29b; border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-weight: 600; }
  .err:empty { display: none; }
  .err .btn { margin-top: 8px; }
  .flash { color: var(--green); background: var(--green-tint); border: 1px solid #75e0a7; border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-weight: 600; }
  .flash:empty { display: none; }
  .price-err { color: var(--red); font-weight: 600; font-size: 15px; margin: 0; }
  .price-err:empty { display: none; }

  .tasks { list-style: none; margin: 0 0 16px; padding: 0; }
  .tasks li { margin: 0 0 10px; }
  .task {
    display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1.5px solid var(--line);
    border-radius: 14px; padding: 14px 16px; color: var(--ink); text-decoration: none; min-height: 56px;
  }
  .task:hover { border-color: var(--teal); }
  .task-title { display: block; font-weight: 700; color: var(--navy); }
  .task-sub { display: block; font-size: 14px; color: var(--muted); }
  .pill { flex: 0 0 auto; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: #eef2f6; color: var(--muted); white-space: nowrap; }
  .task .pill { margin-left: 12px; }
  .pill.done { background: var(--green-tint); color: var(--green); }
  .group-h { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }

  .shots { position: relative; border: 2px dashed #b8c3d1; border-radius: 14px; padding: 14px; margin: 0 0 18px; background: #fff; }
  .shots.dragging { border-color: var(--teal); background: var(--teal-tint); }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .file-input:focus + .btn { outline: 3px solid var(--focus); outline-offset: 2px; }
  .chips { list-style: none; margin: 10px 0 0; padding: 0; }
  .chip { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #fbfcfd; }
  .chip > * + * { margin-left: 10px; }
  .chip.failed { border-color: #fda29b; background: var(--red-tint); }
  .thumb { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 8px; object-fit: cover; background: #e3e8ef; display: block; }
  .chip-text { flex: 1 1 auto; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
  .chip.failed .chip-text { color: var(--red); font-weight: 600; }
  .shot-note { font-size: 15px; color: var(--red); font-weight: 600; margin: 8px 0 0; }
  .shot-note:empty { display: none; }

  .price-row { display: flex; align-items: center; }
  .peso { font-weight: 700; color: var(--muted); margin-right: 8px; }
  .route { font-family: Consolas, Menlo, monospace; font-size: 15px; overflow-wrap: anywhere; background: #eef2f6; padding: 1px 6px; border-radius: 6px; }

  .hp { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }

  .report-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.97);
    border-top: 1px solid var(--line); padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  .report-bar .btn { display: block; width: 100%; max-width: 608px; margin: 0 auto; background: #fff; color: var(--red); border-color: var(--red); }
  .report-bar .btn:hover { background: var(--red-tint); }
  .loading { color: var(--muted); padding: 24px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand" role="img" aria-label="onService PH"><svg class="brand-tile" viewBox="0 0 48 48" width="32" height="32" aria-hidden="true" focusable="false"><rect width="48" height="48" rx="6" fill="#FFFFFF"/><g transform="translate(10.56 10.56) scale(1.12)" fill="none" stroke="#003D9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></svg><span class="brand-word">onService PH</span></span><span class="top-note">App test</span></div></header>
<main id="app" class="wrap" tabindex="-1"><p class="loading">Loading the test...</p></main>
<div id="reportBar" class="report-bar" hidden><button type="button" id="reportBtn" class="btn">Report a problem</button></div>
<noscript><div class="wrap"><p class="err">This page needs JavaScript. Please turn it on, or open the page in Chrome.</p></div></noscript>
<script>
(function () {
  'use strict';

  var API = '/api/v1/feedback/v2';
  var KEY = 'osfb2:';
  var MAX_SHOTS = 10;
  var MAX_BYTES = 10 * 1024 * 1024;
  var EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
  var NETWORK_MSG = 'Could not reach the server. Check your connection and try again. What you typed is still here.';
  var CONSENT_MSG = 'Please agree to the privacy notice to start.';
  var SIDE_LABELS = { start: 'Getting started', customer: 'Customer side', provider: 'Provider side', account: 'Your account' };

  var app = document.getElementById('app');
  var reportBar = document.getElementById('reportBar');
  var reportBtn = document.getElementById('reportBtn');

  var state = {
    study: null,
    session: null,      // { id, token, role }
    progress: null,     // { role, saved: [{kind, itemKey}], problems }
    route: 'welcome',
    flash: '',
    pendingReport: null, // { route }
    appVersion: null,   // last app version this phone told us about (?app=, remembered)
    urlAppVersion: null, // the ?app= on this visit only
    surface: null,
    emailCodes: false,  // true only when GET /api/v1/auth/methods says email codes are on
    sessionStored: false, // true only when the session really was kept on this phone
    shots: {},          // formKey -> [{ id, status, filename, at, url, error, removed }]
    form: null,         // the form on screen: { key, el, saveBtn, saveText, saving, hasShots }
    problemSaved: false,
    consent: false
  };
  // The server deletes screenshots that were never saved with an answer after
  // 24 hours (purgeUnattachedUploads). Older than this, ask for them again.
  var SHOT_MAX_AGE_MS = 23 * 60 * 60 * 1000;
  var SIGN_IN_EMAIL = 'Sign up in the app with your own email address. The app sends a 6-digit code to that email. If it does not arrive within a minute, check your Spam or Promotions folder.';
  var SIGN_IN_ASK_KEN = 'Sign in the way Ken told you, or ask him for your sign-in details.';
  var PROVIDER_ONCE = 'Testing the provider side? Right after you sign up, the app asks "How would you like to use onService?". Choose "I provide services". This choice appears only once, so decide before you tap. You can still book as a customer.';
  var shotSeq = 0;
  var idSeq = 0;

  // ---------- storage (every access guarded: the page must work with storage blocked) ----------
  function load(name) {
    try {
      var raw = window.localStorage.getItem(KEY + name);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function keep(name, value) {
    try {
      window.localStorage.setItem(KEY + name, JSON.stringify(value));
      return true;
    } catch (e) { return false; /* storage blocked or full */ }
  }
  function forget(name) {
    try { window.localStorage.removeItem(KEY + name); } catch (e) { /* storage blocked */ }
  }
  function draftKeys() {
    var keys = [];
    try {
      var ls = window.localStorage;
      for (var i = 0; i < ls.length; i += 1) {
        var k = ls.key(i);
        if (k && k.indexOf(KEY + 'draft:') === 0) keys.push(k.slice(KEY.length));
      }
    } catch (e) { /* storage blocked */ }
    return keys;
  }
  function getDraft(formKey) {
    var d = load('draft:' + formKey);
    if (!d || typeof d !== 'object') d = {};
    if (!d.fields || typeof d.fields !== 'object') d.fields = {};
    if (!Array.isArray(d.shots)) d.shots = [];
    return d;
  }
  function putDraft(formKey, draft) { keep('draft:' + formKey, draft); }

  // ---------- DOM helpers ----------
  function append(el, kids) {
    if (kids === null || kids === undefined || kids === false) return;
    if (!Array.isArray(kids)) kids = [kids];
    for (var i = 0; i < kids.length; i += 1) {
      var c = kids[i];
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) append(el, c);
      else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
  }
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, String(v));
      });
    }
    append(el, kids);
    return el;
  }
  function uid(prefix) { idSeq += 1; return prefix + '-' + idSeq; }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  // ---------- API ----------
  function errorText(body, status) {
    if (body && body.error) {
      if (typeof body.error === 'string') return body.error;
      if (body.error.message) return String(body.error.message);
    }
    if (status === 413) return 'That screenshot is too big. Please add a smaller one.';
    if (status === 429) return 'Too many tries from this connection. Please wait a little and try again.';
    return 'Something went wrong on our side (error ' + status + '). Please try again.';
  }
  async function api(path, opts) {
    var res;
    try {
      res = await window.fetch(API + path, opts || {});
    } catch (e) {
      var netErr = new Error(NETWORK_MSG);
      netErr.status = 0;
      throw netErr;
    }
    var body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (!res.ok || !body || body.success === false) {
      var err = new Error(errorText(body, res.status));
      err.status = res.status;
      throw err;
    }
    return body.data;
  }
  function sessionHeaders(extra) {
    var headers = { 'x-feedback-session': state.session.token };
    if (extra) Object.keys(extra).forEach(function (k) { headers[k] = extra[k]; });
    return headers;
  }

  // ---------- device detection (pre-fills; the tester can change it) ----------
  function ua() { return (window.navigator && navigator.userAgent) || ''; }
  function detectDevice() {
    var u = ua();
    if (/iPad|Tablet/i.test(u) || (/Android/i.test(u) && !/Mobile/i.test(u))) return 'tablet';
    if (/Mobi|Android|iPhone|iPod/i.test(u)) return 'phone';
    return 'computer';
  }
  function detectSurface(device) {
    if (state.surface) return state.surface;
    return (/Android/i.test(ua()) && device === 'phone') ? 'apk' : 'browser';
  }
  function platformDetail() {
    var u = ua();
    var m;
    var os = 'Unknown system';
    if ((m = /Android ([\d.]+)/.exec(u))) os = 'Android ' + m[1];
    else if ((m = /(?:iPhone|CPU) OS ([\d_]+)/.exec(u))) os = 'iOS ' + m[1].replace(/_/g, '.');
    else if (/Windows NT/.test(u)) os = 'Windows';
    else if (/Mac OS X/.test(u)) os = 'Mac';
    else if (/Linux/.test(u)) os = 'Linux';
    var browser = 'unknown browser';
    if ((m = /SamsungBrowser\/([\d.]+)/.exec(u))) browser = 'Samsung Internet ' + m[1];
    else if ((m = /Edg\/(\d+)/.exec(u))) browser = 'Edge ' + m[1];
    else if ((m = /OPR\/(\d+)/.exec(u))) browser = 'Opera ' + m[1];
    else if ((m = /Firefox\/(\d+)/.exec(u))) browser = 'Firefox ' + m[1];
    else if ((m = /Chrome\/(\d+)/.exec(u))) browser = 'Chrome ' + m[1];
    else if ((m = /Version\/([\d.]+).*Safari/.exec(u))) browser = 'Safari ' + m[1];

  // ---------- URL parameters (?report=1&screen=<route>&app=<version>&surface=apk|browser) ----------
  function readParams() {
    var p = null;
    try { p = new URLSearchParams(window.location.search); } catch (e) { p = null; }
    if (p) {
      var surface = p.get('surface');
      if (surface === 'apk' || surface === 'browser') state.surface = surface;
      var appVersion = (p.get('app') || '').trim();
      if (appVersion) { state.appVersion = appVersion.slice(0, 40); state.urlAppVersion = state.appVersion; }
      if (p.get('report') === '1') {
        state.pendingReport = { route: (p.get('screen') || '').trim().slice(0, 200) };
        keep('pendingReport', state.pendingReport);
      }
      if (p.get('report') || p.get('screen')) {
        // So a reload does not open a fresh report form again.
        try { window.history.replaceState(null, '', window.location.pathname + window.location.hash); } catch (e) { /* ignore */ }
      }
    }
    if (!state.pendingReport) {
      var saved = load('pendingReport');
      if (saved && typeof saved.route === 'string') state.pendingReport = saved;
    }
    if (!state.appVersion) state.appVersion = load('appVersion');
    else keep('appVersion', state.appVersion);
    if (!state.surface) state.surface = load('surface');
    else keep('surface', state.surface);
  }

  function readForm(form) {
    var out = {};
    each(form.elements, function (el) {
      if (!el.name || el.name === 'website' || el.type === 'file' || el.type === 'submit' || el.type === 'button') return;
      if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; return; }

        if (!out[el.name]) out[el.name] = [];

  function answersFrom(fields, questions, prefix) {

  // Wires a form: restores its draft, autosaves every change, tracks it as the
  // form on screen (for paste and drop), and runs onSave when Save is pressed.
  function setupForm(formKey, form, saveText, hasShots, onSave) {
    var draft = getDraft(formKey);
    fillForm(form, draft.fields);
    var saveBtn = form.querySelector('button[type="submit"]');
    var current = { key: formKey, el: form, saveBtn: saveBtn, saveText: saveText, saving: false, hasShots: hasShots };
    state.form = current;
    function persist() {
      var d = getDraft(formKey);
      d.fields = readForm(form);
      putDraft(formKey, d);
    }
    form.addEventListener('input', persist);
    form.addEventListener('change', function () { syncChoices(form); persist(); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (current.saving || pendingCount(formKey) > 0) return;
      onSave(readForm(form), current);
    });
    updateSaveButton(current);
    return current;
  }
  function updateSaveButton(current) {
    if (!current || !current.saveBtn) return;
    var pending = pendingCount(current.key);
    if (current.saving) { current.saveBtn.disabled = true; current.saveBtn.textContent = 'Saving...'; return; }
    if (pending > 0) {
      current.saveBtn.disabled = true;
      current.saveBtn.textContent = 'Waiting for ' + plural(pending, 'screenshot', 'screenshots') + ' to finish';
      return;
    }
    current.saveBtn.disabled = false;
    current.saveBtn.textContent = current.saveText;
  }
  function showError(form, message, sessionGone) {

    }

  }
  function clearError(form) {
    var box = form.querySelector('.err');
    if (box) box.textContent = '';
  }

  // While a save is on its way, the form is locked: nothing typed, picked or
  // pasted in that moment could be left out of the save and then lost.
  function lockForm(current, locked) {
    each(current.el.elements, function (el) {

  }
  async function postEntry(current, body, onDone) {
    var form = current.el;

    lockForm(current, true);
    updateSaveButton(current);
    try {
      var data = await api('/sessions/' + state.session.id + '/entries', {
        method: 'POST',
        headers: sessionHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body)
      });
      current.saving = false;
      lockForm(current, false);
      // Screenshots saved with a first impression, mission or wrap-up are kept
      // by the server, so they can never expire from the draft.
      if (body.kind !== 'problem' && Array.isArray(body.screenshots) && body.screenshots.length) {
        shotList(current.key).forEach(function (s) { if (body.screenshots.indexOf(s.filename) !== -1) s.saved = true; });
        persistShots(current.key);
      }
      onDone(data);
    } catch (e) {

      lockForm(current, false);
      showError(form, e.message, e.status === 401 || e.status === 403);
    }

  // ---------- screenshots ----------
  // A screenshot uploaded but not yet saved with an answer is deleted by the
  // server after a day. Drafts remember when each one was uploaded, and
  // whether it was saved with an answer (saved ones are kept by the server).
  function isStale(shot) {
    if (shot.saved) return false;
    return shot.status === 'done' && !(typeof shot.at === 'number' && Date.now() - shot.at < SHOT_MAX_AGE_MS);
  }
  function shotList(formKey) {
    if (!state.shots[formKey]) {
      state.shots[formKey] = getDraft(formKey).shots.map(function (saved) {
        shotSeq += 1;
        var filename = saved && typeof saved === 'object' ? saved.filename : saved;
        var at = saved && typeof saved === 'object' ? saved.at : null;
        var wasSaved = !!(saved && typeof saved === 'object' && saved.saved === true);
        return { id: shotSeq, status: 'done', filename: String(filename || ''), at: at, saved: wasSaved, url: null, error: null };
      }).filter(function (s) { return !!s.filename; });
    }
    return state.shots[formKey];
  }
  function pendingCount(formKey) {
    return (state.shots[formKey] || []).filter(function (s) { return s.status === 'uploading'; }).length;
  }
  function freshShots(formKey) {
    return shotList(formKey).filter(function (s) { return s.status === 'done' && !isStale(s); });
  }
  function doneFilenames(formKey) {
    return freshShots(formKey).map(function (s) { return s.filename; });
  }
  function persistShots(formKey) {
    var d = getDraft(formKey);
    d.shots = freshShots(formKey).map(function (s) { return s.saved ? { filename: s.filename, at: s.at, saved: true } : { filename: s.filename, at: s.at }; });
    putDraft(formKey, d);
  }
  function objectUrl(file) {

    } catch (e) { /* no preview */ }

  }

    try { window.URL.revokeObjectURL(shot.url); } catch (e) { /* ignore */ }
    shot.url = null;
  }
  function clearShots(formKey) {

  }
  function setShotNote(formKey, text) {
    if (!state.form || state.form.key !== formKey) return;
    var note = state.form.el.querySelector('.shot-note');
    if (note) note.textContent = text;
  }
  function addFiles(formKey, files) {
    if (state.form && state.form.key === formKey && state.form.saving) {
      setShotNote(formKey, 'Please wait until saving has finished, then add that screenshot again.');
      return;
    }
    var list = shotList(formKey);
    setShotNote(formKey, '');
    for (var i = 0; i < files.length; i += 1) {
      var file = files[i];
      var active = list.filter(function (s) { return s.status !== 'error' && !isStale(s); }).length;
      if (active >= MAX_SHOTS) {
        setShotNote(formKey, 'You can add up to ' + MAX_SHOTS + ' screenshots here.');
        break;
      }
      shotSeq += 1;
      var shot = { id: shotSeq, status: 'uploading', filename: null, url: objectUrl(file), error: null };
      list.push(shot);
      if (!EXT[file.type]) {
        shot.status = 'error';
        shot.error = 'Please add a JPG, PNG or WebP screenshot.';
      } else if (file.size > MAX_BYTES) {

  async function uploadShot(formKey, shot, file) {

        method: 'POST', headers: sessionHeaders(), body: fd

      shot.filename = data.filename;
      shot.at = Date.now();

  function refreshShots(formKey) {

  }

      if (aboutStarted) return; // the session exists: do not keep name and contact on this phone
      var d = getDraft('about'); d.fields = readForm(form); putDraft('about', d);
    }
    form.addEventListener('input', persistAbout);
    form.addEventListener('change', function () { syncChoices(form); syncProviderNote(); persistAbout(); });
    var saveBtn = form.querySelector('button[type="submit"]');
    var busy = false;
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (busy) return;
      var f = readForm(form);
      clearError(form);
      if (!f.role) { showError(form, 'Please choose which side you will test.'); return; }
      var body = {
        consent: true,
        role: f.role,
        deviceKind: f.deviceKind,
        appSurface: f.appSurface,
        platformDetail: platformDetail(),
        helpMethods: f.helpMethods || [],
        website: form.querySelector('[name="website"]').value
      };
      if (state.appVersion) body.appVersion = state.appVersion;
      if (String(f.testerName || '').trim()) body.testerName = f.testerName.trim();
      if (String(f.testerContact || '').trim()) body.testerContact = f.testerContact.trim();
      busy = true;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Starting...';
      try {
        var data = await api('/sessions', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        if (!data || !data.sessionId) { app.textContent = ''; append(app, h('h1', { tabindex: '-1', text: 'Thank you.' })); return; }
        state.session = { id: data.sessionId, token: data.token, role: f.role };
        if (state.appVersion) state.session.appVersion = state.appVersion;
        state.sessionStored = keep('session', state.session);
        aboutStarted = true;
        forget('draft:about');
        state.progress = { role: f.role, saved: [], problems: 0 };
        afterSessionReady();
      } catch (err) {
        busy = false;
        saveBtn.disabled = false;
        saveBtn.textContent = 'Start the test';
        showError(form, err.message);
      }
    });
    state.form = null;
    return [
      h('h1', { tabindex: '-1', text: 'About you' }),
      h('p', { class: 'muted', text: 'This takes about 30 seconds.' }),

  function priceKey(serviceKey, pointKey) { return 'p:' + serviceKey + ':' + pointKey; }
  // Returns { prices, message, serviceKey } from the form's price boxes.
  function checkPrices(fields) {
    var study = state.study;
    var prices = {};
    var any = false;
    for (var s = 0; s < study.prices.services.length; s += 1) {
      var service = study.prices.services[s];
      var row = {};
      var filled = [];
      for (var p = 0; p < study.prices.points.length; p += 1) {
        var point = study.prices.points[p];
        var raw = String(fields[priceKey(service.key, point.key)] || '').replace(/[\s,]/g, '').replace(/^(?:₱|PHP|P)/i, '');
        if (!raw) continue;
        if (!/^\d{1,7}$/.test(raw) || Number(raw) > 1000000) {
          return { message: 'For "' + service.name + '", please write whole pesos only, like 800.', serviceKey: service.key };
        }
        row[point.key] = Number(raw);
        filled.push(Number(raw));
      }
      for (var i = 1; i < filled.length; i += 1) {
        if (filled[i] < filled[i - 1]) {
          return { message: 'For "' + service.name + '", each price should be the same or higher than the one before it.', serviceKey: service.key };
        }
      }
      if (filled.length) { prices[service.key] = row; any = true; }
    }
    return { prices: any ? prices : null, message: null, serviceKey: null };
  }

  function viewWrapup() {
    var formKey = 'wrapup';
    var study = state.study;
    var questions = wrapupQuestions();
    var priceErrors = {};
    var priceBlocks = study.prices.services.map(function (service) {
      // Polite, and only rewritten when the message changes, so a screen reader
      // does not repeat it on every keystroke.
      var errEl = h('p', { class: 'price-err', 'aria-live': 'polite', 'data-price-error': service.key });
      priceErrors[service.key] = errEl;
      return h('fieldset', { class: 'card' }, [
        h('legend', { text: service.name }),
        study.prices.points.map(function (point) {
          var id = uid('price');
          return h('div', { class: 'field' }, [
            h('label', { for: id, text: point.label }),
            h('div', { class: 'price-row' }, [
              h('span', { class: 'peso', 'aria-hidden': 'true', text: '₱' }),
              h('input', { type: 'text', id: id, name: priceKey(service.key, point.key), inputmode: 'numeric', maxlength: 9, autocomplete: 'off' })
            ])
          ]);
        }),
        errEl
      ]);
    });
    var form = h('form', { novalidate: true }, [
      h('h2', { text: 'How much do you agree?' }),
      h('p', { class: 'muted', text: '1 = ' + study.sus.scale.low + ', 5 = ' + study.sus.scale.high + '.' }),
      study.sus.items.map(function (item, i) {
        return scale('sus' + i, (i + 1) + '. ' + item, 1, 5, study.sus.scale.low, study.sus.scale.high);
      }),
      h('h2', { text: 'Your thoughts' }),
      questions.map(function (q) { return questionField(q, 'a:'); }),
      h('h2', { text: 'Fair prices' }),
      h('p', { class: 'muted', text: 'Optional. In pesos. Leave blank any you are not sure about. Each price should be the same or higher than the one above it.' }),
      priceBlocks,
      errorBox(),
      h('button', { type: 'submit', class: 'btn block', text: 'Save' })
    ]);
    function showPriceCheck() {
      var result = checkPrices(readForm(form));
      Object.keys(priceErrors).forEach(function (k) {
        var text = result.serviceKey === k ? result.message : '';
        if (priceErrors[k].textContent !== text) priceErrors[k].textContent = text;
      });
      return result;
    }
    form.addEventListener('input', function (e) {
      if (e.target && e.target.name && e.target.name.indexOf('p:') === 0) showPriceCheck();
    });
    var view = [
      backLink(),
      h('h1', { tabindex: '-1', text: 'Wrap-up' }),
      h('p', { text: 'Last questions, about the app as a whole. About 5 minutes.' }),
      isSaved('wrapup', 'wrapup') ? h('p', { class: 'note', text: 'You already saved this. Change anything and press Save again to update it.' }) : null,
      form
    ];
    setupForm(formKey, form, 'Save', false, function (fields, current) {
      var sus = [];
      for (var i = 0; i < study.sus.items.length; i += 1) {
        if (!fields['sus' + i]) { showError(form, 'Please answer all 10 statements.'); return; }
        sus.push(Number(fields['sus' + i]));
      }
      var priceCheck = showPriceCheck();
      if (priceCheck.message) { showError(form, priceCheck.message); return; }
      var body = { kind: 'wrapup', sus: sus, answers: answersFrom(fields, questions, 'a:'), screenshots: [] };
      if (priceCheck.prices) body.prices = priceCheck.prices;
      postEntry(current, body, function () {
        markSaved('wrapup', 'wrapup');
        go('thanks');
      });
    });
    showPriceCheck();
    return view;
  }

  function startOver() {
    forget('session');
    state.session = null;
    state.sessionStored = false;
    state.progress = null;
    state.problemSaved = false;
    // Typed text is kept for the new session; screenshots belonged to the old one.
    draftKeys().forEach(function (name) {
      var d = load(name);
      if (d && typeof d === 'object') { d.shots = []; keep(name, d); }
    });
    Object.keys(state.shots).forEach(clearShots);
    state.shots = {};
    go('welcome');
  }

  // ---------- render ----------
  function render() {
    var route = state.route || '';
    if (!state.session) {
      if (route !== 'about') route = 'welcome';
    } else if (route === 'welcome' || route === 'about' || !route) {
      route = 'home';
    }
    state.route = route;
    if (route !== 'problem') state.problemSaved = false;
    state.form = null;
    var view;
    if (route === 'welcome') view = viewWelcome();
    else if (route === 'about') view = viewAbout();
    else if (route === 'first') view = viewFirst();
    else if (route.indexOf('mission/') === 0) view = viewMission(route.slice(8));
    else if (route === 'problem') view = viewProblem();
    else if (route === 'wrapup') view = viewWrapup();
    else if (route === 'thanks') view = viewThanks();
    else view = viewHome();
    app.textContent = '';
    append(app, view);
    if (state.form) refreshShots(state.form.key);
    reportBar.hidden = !state.session || state.route === 'problem';
    var heading = app.querySelector('h1');
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    if (heading) { try { heading.focus(); } catch (e) { /* ignore */ } }
  }

  function show(view) {
    state.form = null;
    app.textContent = '';
    append(app, view);
    reportBar.hidden = true;
    var heading = app.querySelector('h1');
    if (heading) { try { heading.focus(); } catch (e) { /* ignore */ } }
  }

  function afterSessionReady() {
    if (state.pendingReport) { openProblem(); return; }
    var r = routeFromHash();
    go(r && r !== 'welcome' && r !== 'about' ? r : 'home', true);
  }

  async function loadProgress() {
    show(viewLoading('Opening your saved test...'));
    try {
      state.progress = await api('/sessions/' + state.session.id + '/progress', { headers: sessionHeaders() });
      state.session.role = state.progress.role;
      state.sessionStored = keep('session', state.session);
    } catch (e) {
      if (e.status === 401 || e.status === 403) { show(viewLost(e.message)); return; }
      show(viewFatal(e.message, loadProgress));
      return;
    }
    afterSessionReady();
  }

  function studyLooksRight(study) {
    if (!study || typeof study !== 'object') return false;
    var lists = [study.missions, study.missionQuestions, study.missionOutcomes, study.firstImpression, study.problemQuestions,
      study.severities, study.helpMethods, study.wrapup, study.screens];
    for (var i = 0; i < lists.length; i += 1) if (!Array.isArray(lists[i])) return false;
    return !!(study.seq && study.sus && Array.isArray(study.sus.items) && study.sus.scale
      && study.prices && Array.isArray(study.prices.services) && Array.isArray(study.prices.points));
  }

  // Which sign-in the app offers right now (D37). Only when the server says
  // email codes are on does the page promise an emailed code. If the check
  // fails or is slow, the page tells testers to ask Ken instead.
  function loadSignInMethods() {
    var answered = false;
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { answered = true; resolve(false); }, 2500);
      window.fetch('/api/v1/auth/methods', { headers: { Accept: 'application/json' } })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (body) {
          return !!(body && body.success !== false && body.data && body.data.emailCode && body.data.emailCode.enabled === true);
        }, function () { return false; })
        .then(function (on) {
          if (answered) return;
          answered = true;
          clearTimeout(timer);
          resolve(on);
        });
    });
  }
  var signInMethods = null;

  async function loadStudy() {
    show(viewLoading());
    if (!signInMethods) signInMethods = loadSignInMethods();
    try {
      state.study = await api('/study');
      if (!studyLooksRight(state.study)) throw new Error('Please try again in a minute.');
    } catch (e) {
      state.study = null;
      show(viewFatal('We could not load the test. ' + e.message, loadStudy));
      return;
    }
    state.emailCodes = await signInMethods;
    var saved = load('session');
    if (saved && typeof saved.id === 'string' && typeof saved.token === 'string') {
      state.session = { id: saved.id, token: saved.token, role: saved.role };
      if (typeof saved.appVersion === 'string' && saved.appVersion) state.session.appVersion = saved.appVersion;
      // Opened from a newer app build: that version is now the session's.
      if (state.urlAppVersion) state.session.appVersion = state.urlAppVersion;
      await loadProgress();
      return;
    }
    state.consent = load('consent') === true;
    state.route = routeFromHash() === 'about' ? 'about' : 'welcome';
    render();
  }

  readParams();
  window.addEventListener('popstate', onNav);
  window.addEventListener('hashchange', onNav);
  document.addEventListener('paste', onPaste);
  document.addEventListener('dragover', onDragOver);
  document.addEventListener('dragleave', onDragLeave);
  document.addEventListener('drop', onDrop);
  reportBtn.addEventListener('click', openProblem);
  loadStudy().catch(function () {
    try { show(viewFatal('Something went wrong while opening the test.', function () { window.location.reload(); })); } catch (e) { /* page closed */ }
  });
})();
</script>
</body>
</html>
