worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    server_tokens off;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"host":"$host",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    # Two error sinks: the image's symlink (-> /dev/stderr -> `docker logs`)
    # for live debugging, plus a real file on the named volume that fail2ban
    # watches for limit_req floods. The volume path is stable across container
    # recreates, so the fail2ban jail keeps working after a redeploy.
    error_log /var/log/nginx/error.log warn;
    error_log /var/log/nginx/fail2ban-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    upstream api_backend {
        server api:7381;
        keepalive 32;
    }

    # Reusable security headers + TLS (one cert covers api/admin/app/www).
    map $host $hsts { default "max-age=63072000; includeSubDomains; preload"; }

    # ── Port 80: ACME challenge for any host + redirect everything to HTTPS ──
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── API: https://api.onservice.ph ──
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name api.onservice.ph;

        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /metrics {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 127.0.0.1; deny all;
        }
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # §35a — KYC documents (gov ID, NBI, selfie) live under uploads/onboarding/.
        # They are PERSONAL DATA and must never be served by their storage URL.
        # Block the prefix here; they are reachable only through the authenticated
        # API proxy (/api/v1/providers/me/kyc/... and the admin equivalent), which
        # checks the requester is the owner or an admin before streaming the file.
        # `^~` makes this prefix win over the generic `/` proxy location.
        location ^~ /uploads/onboarding/ {
            return 404;
        }
        # Public uploads (booking photos, chat images, etc.) served straight off
        # the shared uploads_data volume on this box.
        location ^~ /uploads/ {
            alias /usr/share/nginx/uploads/;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }

    # ── Admin back office: https://admin.onservice.ph ──
    # SPA served from disk; /api + /socket.io proxied to the API on the SAME
    # origin so the admin's HttpOnly auth cookies stay first-party.
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.onservice.ph;

        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/admin;
        index index.html;

        # Content-hashed build assets are immutable — cache them hard so repeat
        # visits don't re-download. index.html is never matched here (no ext),
        # so new deploys (new hashes) are always picked up immediately.
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
        location / { try_files $uri $uri/ /index.html; }
    }

    # ── Customer + provider web app: https://app.onservice.ph ──
    # Expo web build (token auth, calls the API cross-origin at api.onservice.ph).
    server {
        listen 443 ssl;
        http2 on;
        server_name app.onservice.ph;

        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/app;
        index index.html;

        # Content-hashed Expo web assets are immutable — long-cache them.
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location / { try_files $uri $uri/ /index.html; }
    }

    # ── www → app ──
    server {
        listen 443 ssl;
        http2 on;
        server_name www.onservice.ph;
        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 301 https://app.onservice.ph$request_uri;
    }
}
