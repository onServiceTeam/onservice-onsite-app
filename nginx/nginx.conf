worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    server_tokens off;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"host":"$host",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    # Two error sinks: the image's symlink (-> /dev/stderr -> `docker logs`)
    # for live debugging, plus a real file on the named volume that fail2ban
    # watches for limit_req floods. The volume path is stable across container
    # recreates, so the fail2ban jail keeps working after a redeploy.
    error_log /var/log/nginx/error.log warn;
    error_log /var/log/nginx/fail2ban-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    upstream api_backend {
        server api:7381;
        keepalive 32;
    }

    # Reusable security headers + TLS (one cert covers api/admin/app/www).
    map $host $hsts { default "max-age=63072000; includeSubDomains; preload"; }

    # Content-Security-Policy for the two SPA vhosts (app + admin). The bundles
    # load only same-origin scripts (no inline <script>), call the API + socket
    # same-origin (connect-src 'self'), and use Sentry + hCaptcha. 'unsafe-inline'
    # is needed for style only (react-native-web + Vite inject runtime styles);
    # scripts stay 'self'. frame-ancestors 'none' = clickjacking protection.
    # Default (admin) is strict: the admin bundle has no inline scripts and no
    # eval, so script-src stays 'self'. The customer/provider app (app.onservice.ph)
    # is react-native-web, whose globalThis polyfill uses Function()/eval, so its
    # script-src adds 'unsafe-eval'. Both keep the strong directives that actually
    # stop clickjacking + data exfil (frame-ancestors, connect-src, base-uri,
    # form-action). Captcha is Cloudflare Turnstile (challenges.cloudflare.com).
    map $host $csp {
        default        "default-src 'self'; script-src 'self' https://browser.sentry-cdn.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.s3.amazonaws.com https://*.s3.ap-southeast-1.amazonaws.com; font-src 'self' data:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://challenges.cloudflare.com https://u.expo.dev; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
        app.onservice.ph "default-src 'self'; script-src 'self' 'unsafe-eval' https://browser.sentry-cdn.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.s3.amazonaws.com https://*.s3.ap-southeast-1.amazonaws.com; font-src 'self' data:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://challenges.cloudflare.com https://u.expo.dev; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    }

    # ── TLS hardening (launch-cutover Item 10: SSL Labs A+) ──
    # TLS session resumption (faster handshakes, no security cost) and OCSP
    # stapling (the server fetches the cert's revocation status itself so
    # clients don't have to — required for an A+ grade). Stapling uses the
    # intermediate from Let's Encrypt fullchain.pem; the resolver lets nginx
    # reach the OCSP responder. If stapling can't reach the responder it simply
    # no-ops (no outage). Applies to every server block below.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify off;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    # Explicit forward-secret cipher list for the TLS 1.2 path (SSL Labs A+).
    # TLS 1.3 suites are client-driven and unaffected.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    # ── Port 80: ACME challenge for any host + redirect everything to HTTPS ──
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── API: https://api.onservice.ph ──
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name api.onservice.ph;

        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # E07 — private staging: while dev OTP (000000) is enabled, the
        # customer/provider API must not be reachable by the public, or anyone
        # could log into any account. Restrict to the operator's network.
        # UPDATE this IP if Ken's network changes; REMOVE this block at the
        # production cutover (real SMS OTP on). /metrics keeps its own
        # internal-only allow/deny below (it overrides this). ACME cert renewal
        # runs on port 80 (separate server) and is unaffected.
        allow 124.105.80.4;   # Ken's test network
        deny all;

        location /metrics {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 127.0.0.1; deny all;
        }
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # §35a — KYC documents (gov ID, NBI, selfie) live under uploads/onboarding/.
        # They are PERSONAL DATA and must never be served by their storage URL.
        # Block the prefix here; they are reachable only through the authenticated
        # API proxy (/api/v1/providers/me/kyc/... and the admin equivalent), which
        # checks the requester is the owner or an admin before streaming the file.
        # `^~` makes this prefix win over the generic `/` proxy location.
        location ^~ /uploads/onboarding/ {
            return 404;
        }
        # Public uploads (booking photos, chat images, etc.) served straight off
        # the shared uploads_data volume on this box.
        location ^~ /uploads/ {
            alias /usr/share/nginx/uploads/;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }

    # ── Admin back office: https://admin.onservice.ph ──
    # SPA served from disk; /api + /socket.io proxied to the API on the SAME
    # origin so the admin's HttpOnly auth cookies stay first-party.
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.onservice.ph;

        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # E07 — pre-launch private gate. While the box runs in staging mode
        # (dev OTP on, admin 2FA off) the admin back office must not be reachable
        # by the public. Basic Auth here is first-party to admin.onservice.ph, so
        # the SPA + its same-origin /api/ proxy + /socket.io all keep working once
        # the operator authenticates once. Hash file is server-only (gitignored).
        # Remove this block as part of the production cutover (real 2FA on).
        # E07 staging gate LIFTED for open testing (Ken, 2026-06-28). The app +
        # admin are intentionally public so testers land straight in with no
        # username/password. /api stays JWT-gated (the real access control);
        # admin 2FA + real SMS OTP return at the production cutover.
        auth_basic off;

        root /usr/share/nginx/admin;
        index index.html;

        # Content-hashed build assets are immutable — cache them hard so repeat
        # visits don't re-download. index.html is never matched here (no ext),
        # so new deploys (new hashes) are always picked up immediately.
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
        # HTML must NOT be cached by the browser, or repeat visitors keep the old
        # index.html (and thus the old hashed bundle) after a redeploy. no-cache
        # forces a revalidate (ETag/Last-Modified -> 304 when unchanged), so a new
        # deploy is picked up on the next load. Hashed assets stay immutable above.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security $hsts always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }

    # ── Customer + provider web app: https://app.onservice.ph ──
    # Expo web build (token auth, calls the API cross-origin at api.onservice.ph).
    server {
        listen 443 ssl;
        http2 on;
        server_name app.onservice.ph;

        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # E07 — pre-launch private gate. While the box runs in staging mode
        # (dev OTP 000000 on), the customer/provider app must not be reachable
        # by the public, or anyone could log into any account. We gate it with
        # HTTP Basic Auth (same .htpasswd as admin) instead of an IP allowlist
        # so a remote software tester can reach it from any network/device with
        # one shared password. To keep this first-party (no cross-origin Basic
        # Auth), the web build now talks to the API/socket/uploads on THIS
        # origin via the proxies below — mirroring the admin vhost. /privacy +
        # /terms stay public (NPC + app-store requirement) via `auth_basic off`.
        # Remove this gate at the production cutover (real SMS OTP on).
        # E07 staging gate LIFTED for open testing (Ken, 2026-06-28). The app +
        # admin are intentionally public so testers land straight in with no
        # username/password. /api stays JWT-gated (the real access control);
        # admin 2FA + real SMS OTP return at the production cutover.
        auth_basic off;

        root /usr/share/nginx/app;
        index index.html;

        # Public legal pages (static HTML) — a stable, crawlable URL the NPC and
        # the app stores can read without running the SPA. Kept in a separate
        # mount so they survive mobile-web redeploys. `auth_basic off` lifts the
        # gate so these stay publicly reachable.
        location = /privacy { auth_basic off; default_type text/html; alias /usr/share/nginx/legal/privacy.html; }
        location = /terms   { auth_basic off; default_type text/html; alias /usr/share/nginx/legal/terms.html; }

        # Public UX-tester feedback page. Ungated on purpose so Ken can send the
        # link (app.onservice.ph/feedback, or www → app redirect) to anyone. The
        # page POSTs to /api/v1/feedback (public route, honeypot + per-IP limit);
        # the collected feedback is read back only via the key-protected
        # /api/v1/feedback/export.* endpoints. Served from the same ./legal mount.
        location = /feedback  { auth_basic off; default_type text/html; alias /usr/share/nginx/legal/feedback.html; }
        location = /feedback/ { auth_basic off; default_type text/html; alias /usr/share/nginx/legal/feedback.html; }

        # Same-origin API proxy (web build is exported with
        # EXPO_PUBLIC_API_URL=https://app.onservice.ph).
        #
        # IMPORTANT — Basic Auth gate vs Bearer tokens share the Authorization
        # header. The mobile app authenticates its API calls with
        # `Authorization: Bearer <jwt>`, which would COLLIDE with the gate's
        # `Authorization: Basic` and 401 every authenticated request (admin
        # avoids this because it uses cookie auth, not bearer). So we DON'T gate
        # the authenticated API — the JWT itself is the access control and the
        # public has no valid token. We DO keep the gate on the two
        # unauthenticated dev-OTP login endpoints (the actual E07 exposure:
        # 000000 logs you in as anyone). Those carry no bearer token pre-login,
        # so the browser's cached Basic creds satisfy the gate with no collision.
        location = /api/v1/auth/send-otp {
            auth_basic off;
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/v1/auth/verify-otp {
            auth_basic off;
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            auth_basic off;   # Bearer-authenticated; JWT is the gate (see above)
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /socket.io/ {
            auth_basic off;   # socket auth rides the handshake, not Basic
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # KYC documents (gov ID, NBI, selfie) are personal data — never served
        # by storage URL; reachable only via the authenticated API proxy. Mirror
        # the api vhost guard so a same-origin storage URL can't leak them.
        location ^~ /uploads/onboarding/ { return 404; }
        # Public uploads (booking photos, chat images). <img> requests carry no
        # bearer token, but keeping them ungated avoids any Basic/Bearer edge
        # case and they aren't sensitive. Requires
        # UPLOAD_BASE_URL=https://app.onservice.ph/uploads on the box.
        location ^~ /uploads/ {
            auth_basic off;
            alias /usr/share/nginx/uploads/;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        # Content-hashed Expo web assets are immutable — long-cache them.
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # HTML must NOT be cached by the browser (see admin vhost note) so a
        # redeploy's new bundle is picked up on the next load. no-cache forces a
        # revalidate; the hashed JS/CSS above stay immutable.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security $hsts always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }

    # ── www → app ──
    server {
        listen 443 ssl;
        http2 on;
        server_name www.onservice.ph;
        ssl_certificate /etc/letsencrypt/live/api.onservice.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.onservice.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 301 https://app.onservice.ph$request_uri;
    }

    # ── onservice.com.ph (new GoDaddy brand domain) ──────────────────────────
    # app/www/admin.onservice.com.ph resolve to this box. Until the apps are
    # rebuilt to be served natively on this domain, these vhosts 301-redirect
    # over HTTPS to the matching working onservice.ph host, so the new domain
    # works securely today. One Let's Encrypt cert (app.onservice.com.ph + www +
    # admin SANs) covers all three; the renew loop picks it up automatically.
    # The apex (onservice.com.ph) is intentionally omitted until its @ A-record
    # is set at GoDaddy and the cert is re-issued to include it.
    server {
        listen 443 ssl;
        http2 on;
        server_name app.onservice.com.ph www.onservice.com.ph;
        ssl_certificate /etc/letsencrypt/live/app.onservice.com.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.onservice.com.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security $hsts always;
        return 301 https://app.onservice.ph$request_uri;
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.onservice.com.ph;
        ssl_certificate /etc/letsencrypt/live/app.onservice.com.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.onservice.com.ph/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security $hsts always;
        return 301 https://admin.onservice.ph$request_uri;
    }
}
