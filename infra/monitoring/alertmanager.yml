# Bug 1309 fix verified.
# Phase 14 Dispatch 01.
#
# Alertmanager config. Routes severity=page to the on-call PagerDuty
# integration and severity=warn to a Slack channel. Both URLs come from
# environment variables resolved at container start (see infra/monitoring/
# README in D14 for the deploy mechanism). The placeholders in the file
# below are deliberately marked PLACEHOLDER_ so the Bug 1309 gate fails
# loudly if someone forgets to substitute them at deploy time.

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ops-slack
  routes:
    - matchers:
        - severity = page
      receiver: pagerduty-oncall
      continue: true

receivers:
  - name: pagerduty-oncall
    pagerduty_configs:
      - service_key: PLACEHOLDER_PAGERDUTY_INTEGRATION_KEY
        severity: "{{ .CommonLabels.severity }}"

  - name: ops-slack
    slack_configs:
      - api_url: PLACEHOLDER_SLACK_WEBHOOK_URL
        channel: "#onservice-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: |-
          {{ range .Alerts }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # If the API is down, don't also page about its derived business metrics —
  # they will all be "no data" by definition.
  - source_matchers:
      - alertname = "ApiDown"
    target_matchers:
      - alertname =~ "DisputesQueueBackingUp|NoCompletedBookingsToday|NoActiveProviders|ApiHighMemoryRSS"
    equal: ["cluster"]
