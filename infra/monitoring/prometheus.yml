# Bug 1309 fix verified.
# Phase 14 Dispatch 01.
#
# Production Prometheus config. Replaces the empty/placeholder config that
# would have left every alert rule "no data" forever.
#
# Deploy notes:
#   1. The api / postgres / redis service targets are written as DNS names —
#      replace with the actual service-discovery mechanism for the chosen
#      hosting platform (ECS service discovery, Kubernetes ServiceMonitor,
#      EC2 SD, etc.) when D14 cutover wires the real cluster. The current
#      values are valid for a docker-compose-style deploy and for the local
#      Dispatch 0.5 stack.
#   2. Alertmanager URL must be set via $ALERTMANAGER_URL or replaced inline
#      before applying.
#   3. RULE_FILES path is relative to this file when Prometheus is launched
#      with `--config.file=infra/monitoring/prometheus.yml`.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: onservice-prod
    region: ap-southeast-1

rule_files:
  - rules/onservice.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "api:7381"
        labels:
          service: api
          tier: backend

  # Postgres exporter — assumes prometheus-postgres-exporter sidecar.
  - job_name: postgres
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: postgres
          tier: data

  # Redis exporter — assumes oliver006/redis_exporter sidecar.
  - job_name: redis
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: redis
          tier: data
