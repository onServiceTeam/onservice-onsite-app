<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="onService PH">
  <!-- onService PH mark, blue tile: use on white or light backgrounds, and for favicons.
       48x48 tile, corner radius 6 (12.5%). The 24-unit lucide house box is scaled 1.12x
       (26.88 units, 56% of the tile) and centred, so the house sits a hair above centre,
       as it does in the app. House path: lucide-react 0.456.0 "house". -->
  <rect width="48" height="48" rx="6" fill="#003D9B"/>
  <g transform="translate(10.56 10.56) scale(1.12)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  </g>
</svg>
